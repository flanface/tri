[project]
name = "tri"
version = "3.9.2"
description = "Backend learning engine for contextual Deepwoken talent/mantra selection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
render = ["matplotlib>=3.7", "seaborn>=0.12", "pillow"]
bot = ["discord.py>=2.4", "aiohttp>=3.9", "matplotlib>=3.7", "seaborn>=0.12", "pillow"]
# GPU / fast CPU training: CUDA (NVIDIA) or Metal (Apple, mps). For CUDA install the
# CUDA wheel from https://pytorch.org/get-started/locally/
accel = ["torch>=2.1"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tri*", "bot*"]

[tool.setuptools.package-data]
tri = ["data/*.json"]
